<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Ferretería El Greco - Mantenimiento</title>
    <meta http-equiv="refresh" content="60">
    <meta name="theme-color" content="#FFB842">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-principal: #FFB842;
            --color-principal-hover: #E6A73B;
            --color-secundario: #5C5C5C;
            --color-fondo: #FFFFFF;
            --color-texto: #333333;
            --color-claro: #F8F8F8;
            --color-header-bg: transparent;
            --color-naranja-oscuro: #A96500;
            --color-borde: #EAEAEA;
            --color-superficie: #FFFFFF;
            --sombra-suave: 0 8px 30px rgba(35, 35, 35, 0.07);
            --sombra-tarjeta: 0 18px 55px rgba(35, 35, 35, 0.09);
            --radio-grande: 20px;
            --radio-medio: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(255, 184, 66, 0.12) 0%,
                    rgba(255, 184, 66, 0.035) 35%,
                    transparent 70%
                ),
                var(--color-fondo);
            color: var(--color-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0 20px 45px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            width: calc(100% + 40px);
            background-color: var(--color-header-bg);
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.045);
            position: relative;
        }

        .header-img {
            display: block;
            max-width: 250px;
            width: 100%;
            height: auto;
            object-fit: contain;
            transition: none;
        }

        .header-img:hover {
            transform: none;
        }

        .header-lang-container {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .header-lang-button {
            background-color: var(--color-principal);
            border: 1px solid rgba(169, 101, 0, 0.12);
            color: #382400;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            font-size: 1.4em;
            line-height: 1;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(230, 167, 59, 0.22);
            transition:
                background-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .header-lang-button:hover {
            background-color: var(--color-principal-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(230, 167, 59, 0.3);
        }

        .header-lang-button:focus-visible,
        .directory-button:focus-visible,
        .dropdown-link:focus-visible {
            outline: 3px solid #7C5000;
            outline-offset: 3px;
        }

        .header-lang-dropdown {
            background-color: var(--color-superficie);
            border: 1px solid var(--color-borde);
            padding: 14px;
            text-align: left;
            box-shadow: var(--sombra-tarjeta);
            min-width: 180px;
            display: none;
            margin-top: 10px;
            border-radius: 14px;
            animation: aparecer 0.2s ease;
        }

        .dropdown-language-label {
            color: var(--color-secundario);
            font-size: 0.78em;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin: 0 0 10px;
            font-weight: 700;
        }

        .header-lang-dropdown hr {
            border: 0;
            border-top: 1px solid var(--color-borde);
            margin: 0 0 8px !important;
        }

        .dropdown-link {
            display: block;
            padding: 10px 11px;
            color: var(--color-texto);
            text-decoration: none;
            font-size: 0.9em;
            border-radius: 8px;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                padding-left 0.2s ease;
        }

        .dropdown-link:hover {
            background-color: #FFF6E7;
            color: var(--color-naranja-oscuro);
            padding-left: 15px;
        }

        .dropdown-link.active {
            color: var(--color-naranja-oscuro);
            background-color: #FFF3DC;
            font-weight: 700;
        }

        .main-panel {
            position: relative;
            overflow: hidden;
            padding: 42px 40px 35px;
            border: 1px solid rgba(0, 0, 0, 0.045);
            border-radius: var(--radio-grande);
            max-width: 650px;
            width: 100%;
            margin-top: 42px;
            background-color: var(--color-superficie);
            box-shadow: var(--sombra-tarjeta);
            animation: subir 0.55s ease both;
        }

        .main-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(
                90deg,
                #F2A62A,
                #FFCB70,
                #F2A62A
            );
        }

        .main-title {
            color: var(--color-naranja-oscuro);
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: -0.045em;
            margin: 0 0 20px;
        }

        .main-reason {
            font-size: 1.02em;
            color: #626262;
            margin-bottom: 25px;
            line-height: 1.85;
            max-width: 510px;
            margin-left: auto;
            margin-right: auto;
        }

        .loader {
            border: 4px solid #F3F3F3;
            border-top: 4px solid var(--color-principal);
            border-right: 4px solid var(--color-principal);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1.1s cubic-bezier(0.55, 0.1, 0.45, 0.9) infinite;
            margin: 18px auto 24px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subir {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-section {
            padding-top: 24px;
            margin-top: 25px;
            border-top: 1px solid var(--color-borde);
            text-align: left;
        }

        .contact-section h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3C3C3C;
            font-size: 1.02em;
            font-weight: 700;
            line-height: 1.4;
            margin-top: 14px;
            margin-bottom: 12px;
        }

        .contact-section h3::before {
            content: "";
            display: inline-block;
            flex: 0 0 4px;
            width: 4px;
            height: 20px;
            border-radius: 10px;
            background-color: var(--color-principal);
        }

        .contact-section h3:first-child {
            margin-top: 0;
        }

        .contact-section p {
            margin: 0;
            padding: 10px 12px;
            font-size: 0.91em;
            line-height: 1.6;
            overflow-wrap: anywhere;
            border-radius: 8px;
            background-color: transparent;
            transition: none;
        }

        .contact-section p:hover {
            background-color: transparent;
        }

        .contact-section strong {
            color: var(--color-secundario);
            font-weight: 600;
        }

        .contact-section a {
            color: var(--color-naranja-oscuro);
            text-decoration: none;
            font-weight: 500;
            overflow-wrap: anywhere;
            transition: none;
        }

        .contact-section a:hover {
            color: var(--color-naranja-oscuro);
            text-decoration: none;
        }

        .directory-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 23px;
            min-height: 49px;
            background: linear-gradient(
                135deg,
                #FFC45D 0%,
                var(--color-principal) 100%
            );
            color: #3B290B;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(169, 101, 0, 0.1);
            border-radius: 10px;
            font-size: 0.94em;
            box-shadow: 0 5px 14px rgba(230, 167, 59, 0.17);
            transition: none;
            transform: none;
        }

        .directory-button:hover,
        .directory-button:active {
            background: linear-gradient(
                135deg,
                #FFC45D 0%,
                var(--color-principal) 100%
            );
            color: #3B290B;
            text-decoration: none;
            transform: none;
            box-shadow: 0 5px 14px rgba(230, 167, 59, 0.17);
        }

        .directory-button::after {
            content: "→";
            font-size: 1.25em;
            line-height: 1;
            transition: none;
        }

        .directory-button:hover::after {
            transform: none;
        }

        .directory-button:active {
            transform: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 0 14px 28px;
            }

            .header {
                width: calc(100% + 28px);
                padding: 22px 65px 20px;
            }

            .header-img {
                max-width: 205px;
            }

            .header-lang-container {
                top: 12px;
                right: 12px;
            }

            .header-lang-button {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                font-size: 1.2em;
            }

            .header-lang-dropdown {
                min-width: 165px;
            }

            .main-panel {
                margin-top: 24px;
                padding: 34px 21px 25px;
                border-radius: 16px;
            }

            .main-title {
                margin-bottom: 17px;
            }

            .main-reason {
                font-size: 0.96em;
                line-height: 1.8;
            }

            .directory-button {
                width: 100%;
                max-width: 310px;
                padding: 13px 16px;
            }

            .contact-section {
                padding-top: 20px;
                margin-top: 20px;
            }

            .contact-section h3 {
                font-size: 0.97em;
            }

            .contact-section p {
                padding: 9px 8px;
                font-size: 0.86em;
            }

            .loader {
                width: 38px;
                height: 38px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="header-lang-container">
        <button
            class="header-lang-button"
            onclick="toggleDropdown()"
            aria-label="Seleccionar idioma"
            aria-controls="dropdown"
            aria-expanded="false"
            type="button"
        >&#127757;</button>

        <div class="header-lang-dropdown" id="dropdown">
            <p id="languageLabel" class="dropdown-language-label">Idioma</p>
            <hr style="margin: 0px; margin-bottom: 5px;" />
            <div id="langLinks"></div>
        </div>
    </div>

    <div class="header">
        <img
            class="header-img"
            src="https://www.ferreteriaelgreco.es/web/image/website/1/logo/Ferreter%C3%ADa%20el%20Greco?unique=e5ecd8b"
            alt="Ferretería El Greco"
        >
    </div>

    <div class="main-panel">
        <div class="main-title" id="body_title"></div>
        <div class="main-reason" id="body"></div>

        <div style="margin: 20px 0;">
            <a id="directoryBtn" href="/directorio" class="directory-button"></a>
        </div>

        <h2 id="status"></h2>
        <div class="loader" aria-label="Cargando" role="status"></div>

        <div class="contact-section">
            <h3 id="contact_title_1"></h3>
            <p id="contact_general"></p>
            <p id="contact_profesionales"></p>
            <p id="contact_phone"></p>

            <h3 id="contact_title_2"></h3>
            <p id="contact_soporte_email"></p>
            <p id="contact_soporte_phone"></p>
        </div>
    </div>

    <script>
        const LANGUAGES = {
            'es': 'Español',
            'en': 'English',
            'gl': 'Galego'
        };

        const translations = {
            'es': {
                title: "Portal en mantenimiento",
                reason: " La web no estará disponible del 10 de agosto (15:00 h) al 13 de agosto (10:00 h) por labores de mejora. Disculpen las molestias.",
                status: " ",
                languageLabel: "Idioma",
                contactTitle1: "Departamento de Atención al Cliente",
                contactTitle2: "Soporte de Plataformas",
                contactInfo: {
                    general: 'clientes@ferreteriaelgreco.es',
                    profesional: 'profesionales@ferreteriaelgreco.es',
                    phone: '988 23 15 18',
                    soporte: 'soporteplataformas@ferreteriaelgreco.es',
                    soportePhone: '632 11 80 63'
                },
                labels: {
                    general: "General:",
                    profesional: "Profesionales:",
                    phone: "Teléfono/WhatsApp:",
                    email: "Email:",
                    tel: "Teléfono:"
                },
                directoryBtn: "Ver directorio completo"
            },
            'en': {
                title: "Website out of service",
                reason: "The website will be unavailable from August 10 (3:00 PM) to August 13 (10:00 AM) due to improvement work. We apologize for the inconvenience.",
                status: " ",
                languageLabel: "Language",
                contactTitle1: "Customer Service Department",
                contactTitle2: "Platform Support",
                contactInfo: {
                    general: 'clientes@ferreteriaelgreco.es',
                    profesional: 'profesionales@ferreteriaelgreco.es',
                    phone: '+34 988 23 15 18',
                    soporte: 'soporteplataformas@ferreteriaelgreco.es',
                    soportePhone: '+34 632 11 80 63'
                },
                labels: {
                    general: "General:",
                    profesional: "Professionals:",
                    phone: "Phone/WhatsApp:",
                    email: "Email:",
                    tel: "Phone:"
                },
                directoryBtn: "View full directory"
            },
            'gl': {
                title: "Portal en mantemento",
                reason: "A web non estará dispoñible do 10 de agosto (15:00 h) ao 13 de agosto (10:00 h) por labores de mellora. Desculpen as molestias.",
                status: " ",
                languageLabel: "Idioma",
                contactTitle1: "Departamento de Atención ao Cliente",
                contactTitle2: "Soporte de Plataformas",
                contactInfo: {
                    general: 'clientes@ferreteriaelgreco.es',
                    profesional: 'profesionales@ferreteriaelgreco.es',
                    phone: '988 23 15 18',
                    soporte: 'soporteplataformas@ferreteriaelgreco.es',
                    soportePhone: '632 11 80 63'
                },
                labels: {
                    general: "Xeral:",
                    profesional: "Profesionais:",
                    phone: "Teléfono/WhatsApp:",
                    email: "Email:",
                    tel: "Teléfono:"
                },
                directoryBtn: "Ver directorio completo"
            }
        };

        function setLanguage(lang) {
            if (!translations[lang]) return;

            document.documentElement.lang = lang;

            document.getElementById('title').textContent =
                translations[lang].title;

            document.getElementById('body_title').textContent =
                translations[lang].title;

            document.getElementById('body').textContent =
                translations[lang].reason;

            document.getElementById('status').textContent =
                translations[lang].status;

            document.getElementById('languageLabel').textContent =
                translations[lang].languageLabel;

            document.getElementById('contact_title_1').textContent =
                translations[lang].contactTitle1;

            document.getElementById('contact_title_2').textContent =
                translations[lang].contactTitle2;

            document.getElementById('contact_general').textContent =
                `${translations[lang].labels.general} ${translations[lang].contactInfo.general}`;

            document.getElementById('contact_profesionales').textContent =
                `${translations[lang].labels.profesional} ${translations[lang].contactInfo.profesional}`;

            document.getElementById('contact_phone').textContent =
                `${translations[lang].labels.phone} ${translations[lang].contactInfo.phone}`;

            document.getElementById('contact_soporte_email').textContent =
                `${translations[lang].labels.email} ${translations[lang].contactInfo.soporte}`;

            document.getElementById('contact_soporte_phone').textContent =
                `${translations[lang].labels.tel} ${translations[lang].contactInfo.soportePhone}`;

            document.getElementById('directoryBtn').textContent =
                translations[lang].directoryBtn;

            document.querySelectorAll('.dropdown-link').forEach(link => {
                const isActive = link.dataset.lang === lang;

                link.classList.toggle('active', isActive);

                if (isActive) {
                    link.setAttribute('aria-current', 'true');
                } else {
                    link.removeAttribute('aria-current');
                }
            });
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('dropdown');
            const button = document.querySelector('.header-lang-button');

            const isClosed =
                dropdown.style.display === 'none' ||
                dropdown.style.display === '';

            dropdown.style.display = isClosed ? 'block' : 'none';

            button.setAttribute('aria-expanded', String(isClosed));
        }

        function setLangLinks() {
            const langLinks = document.getElementById('langLinks');

            langLinks.replaceChildren();

            Object.keys(LANGUAGES).forEach(lang => {
                const link = document.createElement('a');

                link.href = "#";
                link.textContent = LANGUAGES[lang];
                link.className = 'dropdown-link';
                link.dataset.lang = lang;

                link.onclick = event => {
                    event.preventDefault();

                    setLanguage(lang);

                    document.getElementById('dropdown').style.display = 'none';

                    document.querySelector('.header-lang-button')
                        .setAttribute('aria-expanded', 'false');
                };

                langLinks.appendChild(link);
            });
        }

        window.onload = function() {
            setLangLinks();
            setLanguage('es');
        };

        document.addEventListener('click', function(event) {
            const container = document.querySelector('.header-lang-container');

            if (!container.contains(event.target)) {
                document.getElementById('dropdown').style.display = 'none';

                document.querySelector('.header-lang-button')
                    .setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('dropdown').style.display = 'none';

                document.querySelector('.header-lang-button')
                    .setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</body>
</html>
